# Render blueprint for the OpenPDFSpecs backend (Docker web service).
# Secrets are marked sync:false — set their values in the Render dashboard, not here.
services:
  - type: web
    name: openpdfspecs-api
    runtime: docker
    plan: free
    region: singapore            # closest free region to the Supabase ap-northeast-1 DB
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      # --- Postgres / Supabase (secrets) ---
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: PDFSPECS_FERNET_KEY
        sync: false
      # --- Non-secret config ---
      - key: SUPABASE_STORAGE_BUCKET
        value: pdf-uploads
      # Embedding dimension — must equal the vector(N) column (0003 set it to 1024) and
      # PDFSPECS_NVIDIA_EMBED_DIMENSIONS below.
      - key: PDFSPECS_EMBEDDING_DIM
        value: "1024"
      # Embedding backend. MUST be set explicitly, and MUST match the backend the corpus
      # was embedded with: vectors from two different models are not comparable, and
      # search.py disables the semantic half outright when it detects a mismatch. Leaving
      # this unset fell back to `local` (BAAI/bge-m3) while the corpus is
      # nv-embedqa-e5-v5, which silently reduced production to lexical-only search — and
      # also pulled torch + sentence-transformers into a free-plan container that cannot
      # hold the model in memory.
      - key: PDFSPECS_EMBEDDING_BACKEND
        value: nvidia
      # Model ids, set here so a provider retirement is a dashboard edit, not a release.
      # NVIDIA switches hosted models off on a schedule and then answers 410 Gone, which
      # is a client error: it is never retried, so every ingestion fails. Both previous
      # defaults died exactly that way (nv-embedqa-e5-v5 on 2026-08-25, and
      # meta/llama-3.1-8b-instruct). Current ids:
      #   https://integrate.api.nvidia.com/v1/models
      - key: PDFSPECS_NVIDIA_EMBEDDING_MODEL
        value: nvidia/nemotron-3.5-embed-1b
      - key: PDFSPECS_NVIDIA_LLM_MODEL
        value: nvidia/nemotron-3.5-lightning-30b-a3b
      # Matryoshka width requested from the embedding model. MUST equal
      # PDFSPECS_EMBEDDING_DIM above and the vector(N) column. The model is natively
      # 2048-d; 1024 keeps the existing column and index, and pgvector cannot build an
      # HNSW index above 2000 dimensions in any case. Leave empty for a model that does
      # not support reduced widths.
      - key: PDFSPECS_NVIDIA_EMBED_DIMENSIONS
        value: "1024"
      # Set to the deployed frontend origin (Vercel URL) in M7's frontend step.
      - key: CORS_ORIGINS
        sync: false
